<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<h3>Hello,</h3>
<h4>Thanks for subscribe SkyDealHunter.
    <br>Your observed flights:
</h4>
<table>
    <thead>
    <tr>
        <th>FROM</th>
        <th>TO</th>
        <th>FROM</th>
        <th>TO</th>
        <th>Suspended</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="flightwacher : ${flightWatchers}">
        <td th:text="${flightwacher.fromCity}"></td>
        <td th:text="${flightwacher.toCity}"></td>
        <td th:text="${flightwacher.fromDate}"></td>
        <td th:text="${flightwacher.toDate}"></td>
        <td th:text="${flightwacher.suspended}"></td>
    </tr>
    </tbody>
</table>
<h4>We wish you safety, comfortable and cheapest flight to your dream places.
</h4>
<h4>
    Greetings,
    <br>SkyDealHunter
</h4>
</body>
</html>
