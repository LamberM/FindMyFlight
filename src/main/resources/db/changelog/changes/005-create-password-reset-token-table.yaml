databaseChangeLog:
  - changeSet:
      id: 005-create-password-reset-token-table
      author: Marcin Lamberski
      comment: Create table for password reset token
      changes:
        - createTable:
            tableName: password_reset_token
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: token
                  type: varchar(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: password_reset_token
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_token_users
        - createIndex:
            tableName: password_reset_token
            indexName: idx_password_reset_token_user_id
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            tableName: password_reset_token
